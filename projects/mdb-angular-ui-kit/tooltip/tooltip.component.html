@if (html) {
<div
  [@fade]="animationState"
  (@fade.done)="onAnimationEnd($event)"
  [@.disabled]="!animation"
  [innerHTML]="title"
  class="tooltip-inner"
></div>
} @if (!html) {
<div
  [@fade]="animationState"
  (@fade.done)="onAnimationEnd($event)"
  [@.disabled]="!animation"
  class="tooltip-inner"
>
  {{ title }}
</div>
}
